<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unified SSO Gate &bull; apps.predaccure.com</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
  <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur">
    <div class="flex items-center gap-3 mb-6">
      <div class="h-12 w-12 rounded-xl bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-bold text-xl shadow-inner">
        SSO
      </div>
      <div>
        <h1 class="text-lg font-bold text-white tracking-tight">Predaccure Apps Security Gate</h1>
        <p id="target-subtitle" class="text-xs text-slate-400">Unified Single Sign-On &bull; *.apps.predaccure.com</p>
      </div>
    </div>

    <div id="error-box" class="hidden mb-4 rounded-xl bg-rose-500/15 border border-rose-500/40 px-4 py-3 text-xs text-rose-300 font-medium"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="pin" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">
          Access Passcode / PIN
        </label>
        <input
          id="pin"
          name="pin"
          type="password"
          required
          autofocus
          autocomplete="current-password"
          placeholder="Enter your passcode..."
          class="w-full bg-slate-950 border border-slate-700 focus:border-emerald-500 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none transition"
        />
      </div>

      <button
        id="submit-btn"
        type="submit"
        class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-lg transition"
      >
        Unlock Application &rarr;
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500">
      <span>Protected by HMAC-SHA256 SSO</span>
      <span>Brute-Force Rate Limited</span>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    const submitBtn = document.getElementById('submit-btn');
    const subtitle = document.getElementById('target-subtitle');

    const params = new URLSearchParams(window.location.search);
    const rawRd = params.get('rd') || '/';
    let safeRedirect = '/';
    try {
      if (rawRd.startsWith('/')) {
        safeRedirect = rawRd;
      } else {
        const u = new URL(rawRd);
        if (u.hostname.endsWith('.apps.predaccure.com')) {
          safeRedirect = u.toString();
          subtitle.textContent = 'Unlocking ' + u.hostname;
        }
      }
    } catch (_) {}

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        const pin = document.getElementById('pin').value;
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = safeRedirect;
        } else {
          errorBox.textContent = data.detail || 'Invalid passcode.';
          errorBox.classList.remove('hidden');
        }
      } catch (err) {
        errorBox.textContent = 'Network error. Please try again.';
        errorBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Unlock Application →';
      }
    });
  </script>
</body>
</html>
